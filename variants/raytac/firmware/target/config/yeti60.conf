CONFIG_ZMK_KEYBOARD_NAME="YETI60 Raytac"
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# EC keys are not GPIO wake sources. Do not enable ZMK's System OFF sleep
# until a low-power key-wake channel is added and qualified.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_SETTINGS=y
CONFIG_ASSERT=y
CONFIG_YETI60_SCAN=y
CONFIG_ZMK_USB_LOGGING=n

# Active scanning remains close to the original 120 Hz. After 30 seconds with
# no pressed or changed key, the scanner slows down and gates the AFE via U8.
CONFIG_YETI60_ACTIVE_SCAN_MS=4
CONFIG_YETI60_IDLE_SCAN_MS=30
CONFIG_YETI60_IDLE_AFTER_MS=30000
CONFIG_YETI60_AFE_IDLE_GATING=y

# Prefer longer BLE intervals when the host accepts them; hosts may override.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_CTLR_TX_PWR_0=y

# Advertise at 200-300 ms instead of the former 100-150 ms fast interval.
# Units are 0.625 ms; 320/480 = 200/300 ms.
CONFIG_ZMK_BLE_ADV_INT_MIN=320
CONFIG_ZMK_BLE_ADV_INT_MAX=480

# Legacy USB descriptor units are 2 mA: request 500 mA after configuration.
CONFIG_USB_MAX_POWER=250
