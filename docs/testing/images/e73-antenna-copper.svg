<text x="45" y="425" font-family="sans-serif" font-size="16">GND 0.000000 mm²</text>
<rect x="340.0" y="120.0" width="234.0" height="169.0" fill="#fff" stroke="#718096"/>
<rect x="535.0" y="120.0" width="39.0" height="169.0" fill="none" stroke="#d62728" stroke-width=".4" stroke-dasharray="4 3"/>
<text x="340" y="395" font-family="sans-serif" font-size="20">In1.Cu</text>
<text x="340" y="425" font-family="sans-serif" font-size="16">GND 0.000000 mm²</text>
<rect x="635.0" y="120.0" width="234.0" height="169.0" fill="#fff" stroke="#718096"/>
<rect x="830.0" y="120.0" width="39.0" height="169.0" fill="none" stroke="#d62728" stroke-width=".4" stroke-dasharray="4 3"/>
