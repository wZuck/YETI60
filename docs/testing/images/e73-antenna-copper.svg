<text x="930" y="395" font-family="sans-serif" font-size="20">B.Cu</text>
<text x="930" y="425" font-family="sans-serif" font-size="16">GND 0.000000 mm²</text>
<text x="35" y="460" font-family="sans-serif" font-size="16">E73 last 3 mm antenna-end band is an engineering screen only; manufacturer gives no numeric host keepout.</text>
<text x="35" y="490" font-family="sans-serif" font-size="16">Only intersection outlines shown; polygon holes omitted visually. JSON union areas retain native polygon holes.</text>
<text x="35" y="520" font-family="sans-serif" font-size="16">Plate projection and separation are evaluated separately. Mechanical non-collision does not establish RF clearance.</text>
