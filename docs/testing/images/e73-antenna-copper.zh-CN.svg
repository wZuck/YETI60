<text x="35" y="460" font-family="sans-serif" font-size="16">E73 天线端最后 3 mm 仅为工程检查区，厂商未给出数字化主板净空要求。</text>
<text x="35" y="490" font-family="sans-serif" font-size="16">图中只画相交外轮廓，视觉上省略孔洞；JSON 并集面积保留原生孔洞。</text>
<text x="35" y="520" font-family="sans-serif" font-size="16">定位板投影和距离另行检查；机械不相交不能证明射频净空合格。</text>
